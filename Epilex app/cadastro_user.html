<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Cadastro_user</title>
</head>
<body>
    <div class="centro">
        <h2>responda essas perguntas para realizar seu cadastro</h2>
        <br>
        <div>
            <div class ="caixa">
            <p>Nome:</p>
            <input type="text" class="caixatexto maior">
            <br>
            <p>E-mail:</p>
            <input type="email" class="caixatexto maior">
            <br>
            <p>Senha:</p>
            <input type="password" class="caixatexto maior">
            <br>
            <p>Confirme sua senha:</p>
            <input type="password" class="caixatexto maior">
            </div>
        </div>  
        <br>
        <br>
        <div class="caixa"> 
            <p>Idade:</p>
            <input type="number" class="caixatexto maior">
            <br>
            <p>Data de nascimento:</p>
            <input type="date" class="caixatexto maior" min="1900-01-01" id="data">
            <p>Sexo:</p>
            <select class="caixatexto maior">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select>
        </div>
        <br>
        <br>
            <div class="caixa">
            <p>Telefone:</p>
            <input type="tel" class="caixatexto maior">
            <br>
            <p>CEP:</p>
            <input type="text" class="caixatexto maior">
        </div>
        <br>
        <br>
    </div>
<script src="script.js"></script>

</body>
</html>
